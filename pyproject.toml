[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-mcp"
version = "0.1.0"
description = "Production-grade Local Gmail Automation MCP Server with 57 tools, rate limiting, and SQLite persistence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "JaySingh79", email = "jays.iitkgp@gmail.com" }
]
keywords = ["mcp", "gmail", "automation", "llm", "claude", "fastmcp"]
dependencies = [
    "mcp>=1.2.0,<2",
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"
gmail-mcp-server = "gmail_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]
